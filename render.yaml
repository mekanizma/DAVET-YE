# Render Blueprint. GitHub reposunu bağlayınca bu dosya servisi kurar.
# Gizli değerler burada yok; panel ilk kurulumda sorar.
services:
  - type: web
    name: davetiye
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /tr
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://davetanisi.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVER_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SHOPIER_PAT
        sync: false
      - key: SHOPIER_WEBHOOK_TOKEN
        sync: false
      - key: SHOPIER_SHOP_SLUG
        sync: false
      - key: SHOPIER_API_KEY
        sync: false
      - key: SHOPIER_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SUPPORT_NOTIFY_EMAILS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
